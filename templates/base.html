<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{{ agency_name }} · {% block title %}CRM{% endblock %}</title>
<style>
:root {
  --ink:#1a2332; --paper:#f6f1e8; --sand:#e8dcc8; --sea:#1f6f78; --sea-d:#164e54;
  --coral:#c45c3e; --ok:#2f7d4a; --muted:#6b6258; --card:#fffdf8;
}
*{box-sizing:border-box} body{margin:0;font:15px/1.45 "Iowan Old Style", Palatino, Georgia, serif;background:var(--paper);color:var(--ink)}
a{color:var(--sea-d);text-decoration:none} a:hover{text-decoration:underline}
.top{display:flex;align-items:center;gap:28px;padding:16px 28px;background:var(--ink);color:#f6f1e8}
.brand{font-weight:700;letter-spacing:.04em;font-size:18px}
.brand span{color:#e8b86d;font-weight:400}
nav a{color:#d9d0c4;margin-right:18px;font-size:14px}
nav a.on{color:#fff;border-bottom:2px solid #e8b86d;padding-bottom:2px}
main{padding:24px 28px 64px;max-width:1200px}
h1{font-size:28px;margin:0 0 6px} .sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--sand);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--sand);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed #eadfce}
.row:last-child{border:0}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--sand)}
.pill.late{background:#f3d4c8;color:#7a2e1c}
.pill.ok{background:#d5eadb;color:#1d5a32}
.btn{display:inline-block;background:var(--sea);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.btn.ghost{background:transparent;color:var(--sea-d);border:1px solid var(--sea)}
.btn.small{padding:4px 10px;font-size:13px}
form.inline{display:inline}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #d7cbb8;border-radius:8px;background:#fff}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 14px;align-items:end}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(160px,1fr));gap:10px;overflow:auto}
.col{background:#efe6d6;border-radius:12px;padding:10px;min-height:220px}
.col h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ticket{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 0 #e5d8c2}
.ticket strong{display:block}
.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--sand);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:900px){.kanban{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">{{ agency_name }} <span>travel CRM</span></div>
  <nav>
    <a href="/" class="{% if nav=='home' %}on{% endif %}">Desk</a>
    <a href="/leads" class="{% if nav=='leads' %}on{% endif %}">Pipeline</a>
    <a href="/bookings" class="{% if nav=='bookings' %}on{% endif %}">Bookings</a>
    <a href="/packages" class="{% if nav=='packages' %}on{% endif %}">Packages</a>
    <a href="/customers" class="{% if nav=='customers' %}on{% endif %}">Guests</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body></html>
